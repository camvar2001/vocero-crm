name: Inmob pilot

on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [verify, core, red, ui-red]
        default: verify
  push:
    branches: [codex/century-agentes-web]

concurrency:
  group: inmob-pilot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  red:
    if: inputs.phase == 'red'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Existing baseline tests
        run: pnpm exec vitest run --exclude "tests/unit/inmob*.test.ts" --exclude "tests/unit/native-localonlybooking.test.ts"
      - name: Feature red tests
        run: pnpm exec vitest run tests/unit/inmob tests/unit/native-localonlybooking.test.ts

  ui-red:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'ui-red'
    runs-on: ubuntu-latest
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/e2e-inmob.mjs

  verify:
    if: github.event_name == 'workflow_dispatch' && (inputs.phase == 'verify' || inputs.phase == 'core')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - inmob: ""
            agenda: ""
            channels: ""
          - inmob: "on"
            agenda: "on"
            channels: "whatsapp,instagram,messenger,telegram"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inmob_ci
          POSTGRES_PASSWORD: inmob_ci
          POSTGRES_DB: inmob_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U inmob_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CHANNELS: ${{ matrix.config.channels }}
      INMOB: ${{ matrix.config.inmob }}
      AGENDA: ${{ matrix.config.agenda }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
        if: ${{ !cancelled() }}
      - run: pnpm test
        if: ${{ !cancelled() }}
      - run: pnpm build
        if: ${{ !cancelled() }}
      - name: Real PostgreSQL claims and isolation
        if: ${{ matrix.config.inmob == 'on' && !cancelled() }}
        env:
          DATABASE_URL: postgresql://inmob_ci:inmob_ci@localhost:5432/inmob_ci
          APP_BASE_URL: http://localhost:3000
          BETTER_AUTH_SECRET: inmob-ci-fixture-secret
          ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          META_WEBHOOK_VERIFY_TOKEN: inmob-ci-fixture
          INMOB_DB_TEST: isolated-ci
        run: |
          pnpm db:migrate
          pnpm exec esbuild scripts/inmob-db-test.ts --bundle --platform=node --format=esm --outfile=.tmp/inmob-db-test.mjs --alias:@=./src --packages=external
          node .tmp/inmob-db-test.mjs
      - name: Inmob browser behavior (mock gateway/local DB)
        if: ${{ inputs.phase == 'verify' && matrix.config.inmob == 'on' && !cancelled() }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/e2e-inmob.mjs

  image:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'verify' && github.repository == 'camvar2001/vocero-crm' && github.ref == 'refs/heads/codex/century-agentes-web'
    permissions:
      contents: read
      packages: write
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:inmob-${{ github.sha }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=inmob-pilot
          cache-to: type=gha,mode=max,scope=inmob-pilot
          outputs: type=docker,dest=/tmp/vocero-inmob-image.tar
      - name: Archive image for local pilot
        run: gzip -1 /tmp/vocero-inmob-image.tar
      - uses: actions/upload-artifact@v7
        with:
          name: inmob-pilot-image
          path: /tmp/vocero-inmob-image.tar.gz
          compression-level: 0
          retention-days: 3
      - name: Digest
        run: echo "digest=${{ steps.image.outputs.digest }}"
