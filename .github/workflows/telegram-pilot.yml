name: Telegram pilot

on:
  workflow_dispatch:
  push:
    branches: [codex/telegram-local]

concurrency:
  group: telegram-pilot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channels: ["", "whatsapp,instagram,messenger,telegram"]
    env:
      CHANNELS: ${{ matrix.channels }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
        if: ${{ !cancelled() }}
      - run: pnpm test
        if: ${{ !cancelled() }}
      - run: pnpm build
        if: ${{ !cancelled() }}

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:telegram-${{ github.sha }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=telegram-pilot
          cache-to: type=gha,mode=max,scope=telegram-pilot
          outputs: type=docker,dest=/tmp/vocero-telegram-image.tar
      - name: Archive image for local pilot
        run: gzip -1 /tmp/vocero-telegram-image.tar
      - uses: actions/upload-artifact@v7
        with:
          name: telegram-pilot-image
          path: /tmp/vocero-telegram-image.tar.gz
          compression-level: 0
          retention-days: 3
      - name: Digest
        run: echo "digest=${{ steps.image.outputs.digest }}"
